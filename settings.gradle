pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

// Permite ao Gradle baixar sozinho o JDK 17 usado na compilacao (toolchain),
// caso nenhum JDK 17 seja encontrado na maquina.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'craterborn'

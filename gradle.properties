# Memoria para o Gradle. O processo de decompilacao do Minecraft precisa de bastante.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## ---------------------------------------------------------------
## Ambiente
## ---------------------------------------------------------------

# Minecraft e Forge precisam combinar entre si.
minecraft_version=1.20.1
# Faixa estreita de proposito: impede o mod de carregar em 1.20.2+ (Forge 48+), onde a API mudou.
minecraft_version_range=[1.20.1,1.20.2)

# Ultimo build RECOMENDADO do Forge para 1.20.1 que consegui confirmar (47.4.0, anuncio oficial de 04/01/2025).
# Para testar um build 47.4.x mais novo, basta trocar este numero e recompilar.
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)

# Mapeamentos oficiais da Mojang.
mapping_channel=official
mapping_version=1.20.1

## ---------------------------------------------------------------
## Mod
## ---------------------------------------------------------------

mod_id=craterborn
mod_name=Craterborn: Demons Below
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.craterborn
# Troque pelo seu nome se quiser aparecer na lista de mods.
mod_authors=Craterborn Team
# Apenas ASCII neste arquivo (o Gradle le .properties como ISO-8859-1).
mod_description=Ancient demons sleep beneath the rare craters of the Overworld. Slay one, take its horn, and choose your fate.
